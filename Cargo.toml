[package]
name = "rdp-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
rusqlite = "0.32"
libsecret = "0.7"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
roxmltree = "0.20"
ssh2 = "0.9"
sha2 = "0.10"
base64 = "0.22"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

# Pixel packing must also remain usable under cargo run (development builds).
[profile.dev.package.rdp-manager]
opt-level = 2
