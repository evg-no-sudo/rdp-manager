[package]
name = "rdp-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
rusqlite = "0.32"
libsecret = "0.7"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
tempfile = "3"
